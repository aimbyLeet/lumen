[workspace]
resolver = "3"
members = [
    "crates/color",
    "crates/protocol",
    "crates/transport",
    "crates/signal",
    "crates/desktop",
    "crates/vdd",
    "crates/audio",
    "crates/opus-sys",
    "crates/nvenc-sys",
    "crates/nvenc",
    "crates/nvdec-sys",
    "crates/decoder",
    "crates/input",
    "crates/capture",
    "crates/gpu-convert",
    "apps/client",
    "apps/host",
    "apps/server",
    "apps/host-app",
    "apps/client-app",
    "tools/bench",
    "tools/decode",
    "tools/netsim",
    "tools/compare",
    "tools/patterns",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
cc = "1"
embed-resource = "3"
clap = { version = "4", features = ["derive", "env"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
rayon = "1"
reed-solomon-simd = "3.1"
socket2 = { version = "0.5", features = ["all"] }
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
ring = "0.17"
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Certificates' keys (a server trusted by its key's fingerprint); rustls uses it already.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

color = { path = "crates/color" }
protocol = { path = "crates/protocol" }
transport = { path = "crates/transport" }
signal = { path = "crates/signal" }
desktop = { path = "crates/desktop" }
vdd = { path = "crates/vdd" }
audio = { path = "crates/audio" }
opus-sys = { path = "crates/opus-sys" }
nvenc-sys = { path = "crates/nvenc-sys" }
nvenc = { path = "crates/nvenc" }
nvdec-sys = { path = "crates/nvdec-sys" }
decoder = { path = "crates/decoder" }
input = { path = "crates/input" }
capture = { path = "crates/capture" }
gpu-convert = { path = "crates/gpu-convert" }

[profile.release]
debug = 1

# Reed-Solomon is very slow unoptimised (transport unit tests: 63 s -> 10 s).
[profile.dev.package.reed-solomon-simd]
opt-level = 3
