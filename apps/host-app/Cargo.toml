[package]
name = "lumen-host-app"
description = "Lumen Host: the host's window and tray; manages the registration in the Lumen Host service (Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lumen-host-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
capture.workspace = true
desktop.workspace = true
serde.workspace = true
serde_json.workspace = true
signal.workspace = true
tauri = { version = "=2.12.1", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "=2.5.2"
transport.workspace = true
vdd.workspace = true
