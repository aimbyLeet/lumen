[package]
name = "lumen-client-app"
description = "Lumen Client: cards of hosts, settings; opens lumen-client.exe windows (Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lumen-client-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
anyhow.workspace = true
signal.workspace = true
desktop.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.1", features = ["custom-protocol"] }
tauri-plugin-single-instance = "=2.5.2"
transport.workspace = true
windows.workspace = true

[dev-dependencies]
lumen-server = { path = "../server" }
